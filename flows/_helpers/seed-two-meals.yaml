appId: com.tummytracker.app.dev
# Helper — adds "Oatmeal" and "Pizza slice" via the two-screen component ->
# review chain (Home's "Add an entry manually" opens ComponentForm at
# /meal/component, not the old single-screen LogEntryForm, since the
# 2026-07-03 OFF search-by-name cycle — rewritten 2026-08-16 test-backfill,
# was stale at "Entry name").
# Reworked 2026-08-28 (outcome-based insights cycle): meal/snack sentiment no
# longer exists (removed from the schema and every form) — dropped the old
# "sentiment-5"/"sentiment-1" taps on the meal-review screen. Dependents only
# need two named, distinct-slot entries to exist; none of them read a
# sentiment value.
# Assumes the app is already running and the Home screen is visible.
# Invoke via: runFlow: _helpers/seed-two-meals.yaml
---
- tapOn:
    text: "Add an entry manually"
- assertVisible:
    text: "Component name"
- tapOn:
    text: "Component name"
- inputText: "Oatmeal"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Finish meal"
    direction: DOWN
- tapOn:
    text: "Finish meal"
- waitForAnimationToEnd

# Meal review screen: name arrives prefilled from the single component
- assertVisible: "Oatmeal"
- tapOn:
    text: "Breakfast"
- scrollUntilVisible:
    element:
      text: "Save meal"
    direction: DOWN
- tapOn:
    text: "Save meal"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "TummyTracker"

- tapOn:
    text: "Add an entry manually"
- tapOn:
    text: "Component name"
- inputText: "Pizza slice"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Finish meal"
    direction: DOWN
- tapOn:
    text: "Finish meal"
- waitForAnimationToEnd

- assertVisible: "Pizza slice"
- tapOn:
    text: "Lunch"
- scrollUntilVisible:
    element:
      text: "Save meal"
    direction: DOWN
- tapOn:
    text: "Save meal"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "TummyTracker"
