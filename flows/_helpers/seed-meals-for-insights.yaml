- assertVisible: "TummyTracker"

# The outcome: a significant symptom logged at "now" — strictly after all
# five Wheat Bread meals (set hours in the past above) and within the 24h
# window.
- tapOn: "Log a symptom"
- waitForAnimationToEnd
- tapOn: "Bloating"
- tapOn: "Severity 3: Significant"
- tapOn: "Save"
- waitForAnimationToEnd
- assertVisible: "TummyTracker"
