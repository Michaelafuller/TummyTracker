# Controls: dated well outside every outcome window so they contribute to the
# baseline denominator (every named food entry is eligible for
# analyzeFoodOutcomes) but are never themselves a hit.
- tapOn:
    text: "Add an entry manually"
- tapOn:
    text: "Component name"
- inputText: "Rice Bowl"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Finish meal"
    direction: DOWN
- tapOn:
    text: "Finish meal"
- waitForAnimationToEnd
- tapOn:
    text: "Choose date"
- waitForAnimationToEnd
- repeat:
    times: ${output.controlMonthsBack}
    commands:
      - tapOn:
          text: "Previous month"
- tapOn: "${output.controlDateLabel}"
- tapOn: "OK"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Save meal"
    direction: DOWN
- tapOn:
    text: "Save meal"
- waitForAnimationToEnd
- waitForAnimationToEnd
