appId: com.tummytracker.app.dev
# Helper — seeds 5 "Wheat Bread" meals (low sentiment) + 2 "Rice Bowl" meals
# (high sentiment) to trigger analyzeFoodSentiment.
# Ingredients omitted to avoid scroll — food name alone is enough for food
# sentiment analysis. Assumes app is running and Home screen is visible.
# Rewritten 2026-08-16 test-backfill for the two-screen component -> review
# chain (Home's "Add an entry manually" opens ComponentForm, not the old
# single-screen LogEntryForm — was stale at "Entry name").
---
- tapOn:
    text: "Add an entry manually"
- assertVisible:
    text: "Component name"
- tapOn:
    text: "Component name"
- inputText: "Wheat Bread"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Finish meal"
    direction: DOWN
- tapOn:
    text: "Finish meal"
- waitForAnimationToEnd
- tapOn:
    id: "sentiment-1"
- scrollUntilVisible:
    element:
      text: "Save meal"
    direction: DOWN
- tapOn:
    text: "Save meal"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "TummyTracker"

