appId: com.tummytracker.app.dev
# Phase 1d — Browse and edit:
#   - Entries grouped by day in Journal
#   - Day / Week / Month calendar toggle
#   - Open an entry, edit its Notes, save; reopen and verify the new text persisted
# Reworked 2026-08-28 (outcome-based insights cycle): meal/snack sentiment no
# longer exists, so "change its sentiment" is no longer possible for a
# meal/snack (LogEntryForm has no rating selector — src/features/logging/LogEntryForm.tsx).
# Repurposed to edit the Notes field instead, which persists across reopen —
# a real field, still on this form, still exercises the same save/reload
# round trip the original flow verified.
---
- launchApp:
    clearState: true
- runFlow: _helpers/reconnect-dev-client.yaml

# Seed two entries
- runFlow: _helpers/seed-two-meals.yaml

# --- Journal: verify entries grouped under today ---
- tapOn:
    id: "tab-journal"
- assertVisible: "Oatmeal"
- assertVisible: "Pizza slice"

# --- Calendar mode toggle ---
- tapOn: "Week"
- waitForAnimationToEnd
- assertVisible: "Oatmeal"

- tapOn: "Month"
- waitForAnimationToEnd
- assertVisible: "Oatmeal"

- tapOn: "Day"
- waitForAnimationToEnd

# --- Type filter ---
- tapOn: "Food"
- assertVisible: "Oatmeal"
- assertVisible: "Pizza slice"

- tapOn: "All"

# --- Edit entry: open Oatmeal and change its Notes ---
- tapOn: "Oatmeal"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Ingredients (optional)"
    direction: DOWN
- tapOn: "Notes"
- inputText: "Edited via 01d-browse-edit"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Save changes"
    direction: DOWN
- tapOn:
    text: "Save changes"
- waitForAnimationToEnd

# Back in journal — edit completed without crashing
- assertVisible: "Journal"

# --- Reopen and verify the new Notes text persisted ---
- tapOn: "Oatmeal"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Edited via 01d-browse-edit"
    direction: DOWN
- assertVisible: "Edited via 01d-browse-edit"
