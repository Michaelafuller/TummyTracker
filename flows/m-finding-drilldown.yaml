appId: com.tummytracker.app.dev
# M — Per-food / ingredient drill-down (2026-08-24 release):
#   - Seed 3x "Onion Dish" (distinct times a few hours ago, tags onion+garlic)
#     + "Rice" control (dated 8+ days back) + a severity-3 symptom "now"
#     (seed-ingredient-reactions, same as d-ingredient-insights)
#   - Tap the onion ingredient finding's card -> /insight/detail
#   - Summary: "3 logs · 3 followed by a rough outcome within 24 h" —
#     deterministic now that each onion meal's time is set explicitly via the
#     native time picker (distinct minutes, all strictly before the seeded
#     symptom) instead of relying on same-minute form-save timing.
#   - Row opens the entry edit screen
# Reworked 2026-08-28 (outcome-based insights cycle): meal/snack sentiment no
# longer exists — the detail screen's summary is now `{count, outcomes}`
# ("N logs · M followed by a rough outcome within 24 h",
# src/app/insight/detail.tsx), not "logs, rated, avg sentiment"; there is no
# per-row sentiment column to assert.
---
- launchApp:
    clearState: true
- runFlow: _helpers/reconnect-dev-client.yaml
- runFlow: _helpers/seed-ingredient-reactions.yaml

# --- Insights: tap the onion finding card ---
- tapOn:
    id: "tab-insights"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "See all logs: onion"
    direction: DOWN
    centerElement: true
- tapOn: "See all logs: onion"
- waitForAnimationToEnd

# --- Detail screen: deterministic summary + at least one outcome marker ---
- assertVisible: ".*3 logs.*"
- assertVisible: ".*3 followed by a rough outcome within 24 h.*"
- assertVisible: "Rough outcome within 24 h"

# --- Row opens the entry editor ---
- tapOn: "Open Onion Dish.*"
- waitForAnimationToEnd
- assertVisible: "Edit entry"
- assertVisible: "Onion Dish"
