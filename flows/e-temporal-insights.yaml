appId: com.tummytracker.app
# E — Temporal insights (partial / best-effort):
#   Assert the Insights summary counts render correctly after seeding food entries.
#   "Timing patterns" requires a 24h windowed join between food and adverse outcome;
#   that gap cannot be constructed deterministically in a clearState run without
#   driving the native date/time picker for every entry — left as manual per spec.
---
- launchApp:
    clearState: true
- runFlow: _helpers/reconnect-dev-client.yaml
# Seed food + BM entries to populate the summary line
- runFlow: _helpers/seed-two-meals.yaml
- tapOn:
    text: "Log a bowel movement"
- waitForAnimationToEnd
- tapOn:
    text: "Type 4: Smooth, soft sausage"
- tapOn:
    id: "sentiment-4"
- tapOn: "Save"
- waitForAnimationToEnd
- assertVisible: "TummyTracker"    # sync: modal fully dismissed, back on Home

# Navigate to Insights
- tapOn:
    id: "tab-insights"
- waitForAnimationToEnd
# Scroll to ensure the summary section is on-screen before asserting
- scrollUntilVisible:
    element:
      text: "Your journal so far"
    direction: DOWN
- assertVisible: "Your journal so far"
# The summary DATA line ("<n> entries · <n> food · <n> BM · <n> rated · avg
# sentiment <x>") is a single Text node (src/app/(tabs)/insights.tsx ~line
# 145), not four separate ones. Maestro's text selector does a FULL regex
# match against a node's whole text (Pattern.matches), not a substring
# search — asserting a bare "food"/"BM"/"rated" against this combined line
# always fails, timing/scrolling aside (confirmed live: identical failure
# whether via scrollUntilVisible, a plain assertVisible with no scroll, or
# immediately after a fresh render — only wildcard-wrapped regexes like
# ".*food.*" match a substring within a longer node). See docs/E2E.md's
# flow-authoring gotchas for the general rule.
- assertVisible: ".*BM.*"
- assertVisible: ".*food.*"
- assertVisible: ".*rated.*"
