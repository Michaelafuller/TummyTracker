appId: com.tummytracker.app.dev
# E — Insights summary counts (food · BM · symptoms · rough outcomes).
# Reworked 2026-08-28 (outcome-based insights cycle): the standalone "Timing
# patterns" section no longer exists — it was merged into the ingredient
# analysis (src/features/analysis/temporal.ts's analyzeIngredientOutcomes IS
# the timing analysis now; there is no separate finding set). The summary
# line itself changed shape too: "{total} entries · {food} food · {bm} BM ·
# {symptoms} symptoms · {roughOutcomes} rough outcomes"
# (src/app/(tabs)/insights.tsx). The BM logged below (Bristol 4, feel rating
# 4) is deliberately NOT a rough outcome — isBadBristol(4) is false and
# feel<=2 is false (src/features/analysis/temporal.ts isOutcome) — so this
# flow's seed data always renders "0 rough outcomes"; that's still real
# summary-line coverage, just not the outcome-count path (see
# m-finding-drilldown.yaml / d-ingredient-insights.yaml for seeds that do
# produce a rough outcome).
---
- launchApp:
    clearState: true
- runFlow: _helpers/reconnect-dev-client.yaml
# Seed food + BM entries to populate the summary line
- runFlow: _helpers/seed-two-meals.yaml
- tapOn:
    text: "Log a bowel movement"
- waitForAnimationToEnd
- tapOn:
    text: "Type 4: Smooth, soft sausage"
- tapOn:
    id: "sentiment-4"
- tapOn: "Save"
- waitForAnimationToEnd
- assertVisible: "TummyTracker"    # sync: modal fully dismissed, back on Home

# Navigate to Insights
- tapOn:
    id: "tab-insights"
- waitForAnimationToEnd
# Scroll to ensure the summary section is on-screen before asserting
- scrollUntilVisible:
    element:
      text: "Your journal so far"
    direction: DOWN
- assertVisible: "Your journal so far"
# The summary DATA line is a single Text node (src/app/(tabs)/insights.tsx),
# not five separate ones. Maestro's text selector does a FULL regex match
# against a node's whole text (Pattern.matches), not a substring search —
# asserting a bare "food"/"BM"/"symptoms"/"rough outcomes" against this
# combined line always fails, timing/scrolling aside. See docs/E2E.md's
# flow-authoring gotchas for the general rule.
- assertVisible: ".*food.*"
- assertVisible: ".*BM.*"
- assertVisible: ".*symptoms.*"
- assertVisible: ".*rough outcomes.*"
