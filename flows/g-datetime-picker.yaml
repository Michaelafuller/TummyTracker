appId: com.tummytracker.app
# Tier-0 G — Native date/time picker opens on tap; Now button resets both chips;
# chosen date/time persists after save.
# Rewritten 2026-08-16 test-backfill for the two-screen component -> review
# chain: DateTimeField ("When") lives on the meal review screen
# (/meal/review), not on ComponentForm — was stale tapping "Choose date"
# straight off the component-confirm screen, which has no date/time field.
---
- launchApp:
    clearState: true

- tapOn:
    text: "Add an entry manually"
- assertVisible:
    text: "Component name"
- tapOn:
    text: "Component name"
- inputText: "Date picker test"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Finish meal"
    direction: DOWN
- tapOn:
    text: "Finish meal"
- waitForAnimationToEnd

# Meal review screen: name arrives prefilled from the single component
- assertVisible: "Date picker test"

# Date chip → OS date picker
- tapOn:
    text: "Choose date"
- waitForAnimationToEnd
- tapOn: "OK"
- waitForAnimationToEnd
- assertVisible:
    text: "Choose date"

# Time chip → OS time picker
- tapOn:
    text: "Choose time"
- waitForAnimationToEnd
- tapOn: "OK"
- waitForAnimationToEnd
- assertVisible:
    text: "Choose time"

# Now button resets both
- tapOn:
    text: "Set to now"
- assertVisible:
    text: "Choose date"
- assertVisible:
    text: "Choose time"

- scrollUntilVisible:
    element:
      text: "Save meal"
    direction: DOWN
- tapOn:
    text: "Save meal"
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    id: "tab-home"

# Re-open and verify date field still populated (entry/[id].tsx renders
# LogEntryForm for a single-component entry, which reuses DateTimeField)
- tapOn:
    id: "tab-journal"
- waitForAnimationToEnd
- tapOn: "Date picker test"
- waitForAnimationToEnd
- assertVisible:
    text: "Choose date"
