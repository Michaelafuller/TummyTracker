appId: com.tummytracker.app.dev
tags: [goals]
# Nav — all five bottom tabs reachable without crash; each screen renders
# its landmark content. (Goals tab added 2026-08-15 cycle — this flow was
# stale at 4 tabs until the 2026-08-16 test-backfill verification pass.)
# NOTE: Insights screen has no "Insights" subtitle heading (finding — see RESULTS.md).
# "Your journal so far" is used instead as it is always rendered on that screen.
---
- launchApp:
    clearState: true
- runFlow: _helpers/reconnect-dev-client.yaml
- assertVisible: "TummyTracker"

- tapOn:
    id: "tab-journal"
# "Journal" is the subtitle rendered on the Journal screen content (explore.tsx:94)
- assertVisible: "Journal"

- tapOn:
    id: "tab-insights"
- waitForAnimationToEnd
# Insights screen renders this bold heading unconditionally (insights.tsx:78)
- assertVisible: "Your journal so far"

- tapOn:
    id: "tab-goals"
- waitForAnimationToEnd
# "Goals" subtitle now comes from GoalsSection's heading, not the page
# header (goals.tsx header reads "Today" + long date as of 2026-08-21).
- assertVisible: "Goals"

# Meds tab (Medications epic, Cycle A — 2026-09-26)
- tapOn:
    id: "tab-meds"
- waitForAnimationToEnd
- assertVisible: "Medications"

# Settings is no longer a tab: it's the top-right gear, pushed as a Stack
# screen (header title "Settings"), so go back before tapping a tab again.
- assertNotVisible:
    id: "tab-settings"
- tapOn:
    id: "open-settings"
- waitForAnimationToEnd
- assertVisible: "Settings"
- back
- waitForAnimationToEnd

- tapOn:
    id: "tab-home"
- assertVisible: "TummyTracker"
